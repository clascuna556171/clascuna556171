name: Update Monochrome Telemetry

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate telemetry SVGs
        run: node scripts/update-telemetry.mjs
      - name: Commit updated telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry-light.svg assets/telemetry-dark.svg
          if git diff --cached --quiet; then
            echo "No telemetry changes."
          else
            git commit -m "chore: update monochrome streak & activity telemetry"
            git push
          fi
