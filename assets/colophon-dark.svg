<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="105" viewBox="0 0 1200 105" role="img" aria-label="STXIC Optical Colophon — Keep it simple.">
  <defs>
    <linearGradient id="cOrbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#242830" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8C919B" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#8C919B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#242830" stop-opacity="0"/>
    </linearGradient>
    <style>
      .bead-move { animation: beadDrift 9s ease-in-out infinite; }
      @keyframes beadDrift {
        0%, 100% { transform: translateX(-180px); opacity: 0.25; }
        50% { transform: translateX(180px); opacity: 0.95; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bead-move { animation: none !important; }
      }
    </style>
  </defs>

  <path d="M120 30 C340 6 860 6 1080 30" fill="none" stroke="url(#cOrbit)" stroke-width="1.1"/>
  <circle class="bead-move" cx="600" cy="12" r="2.6" fill="#ECEDEA"/>

