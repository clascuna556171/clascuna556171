<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="374" viewBox="0 0 1200 374" role="img" aria-label="Christian Lascuna — STXIC Labs Executive Business Card">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141619"/>
      <stop offset="100%" stop-color="#0F1114"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" stop-opacity="0"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.12)" stop-opacity="1"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.12)" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cottonGrain" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.6" fill="rgba(236, 237, 234, 0.032)"/>
      <circle cx="8" cy="9" r="0.5" fill="rgba(236, 237, 234, 0.032)"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="10" y="10" width="1180" height="350" rx="5"/>
    </clipPath>
    <style>
      .card-sheen { animation: cardSweep 9s ease-in-out infinite; }
      .dot-pulse { animation: softPulse 3s ease-in-out infinite; }
      @keyframes cardSweep {
        0%, 100% { transform: translateX(-320px); opacity: 0; }
        40% { opacity: 0.7; }
        70% { transform: translateX(1320px); opacity: 0; }
      }
      @keyframes softPulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.3; }
      }
      @media (prefers-reduced-motion: reduce) {
        .card-sheen, .dot-pulse { animation: none !important; }
      }
    </style>
  </defs>

  <rect x="14" y="16" width="1176" height="348" rx="5" fill="rgba(0, 0, 0, 0.55)"/>
  <g clip-path="url(#cardClip)">
    <rect x="10" y="10" width="1180" height="350" rx="5" fill="url(#cardGrad)"/>
    <rect x="10" y="10" width="1180" height="350" fill="url(#cottonGrain)"/>
    <text x="600" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', Didot, 'Bodoni MT', serif" font-size="214" font-weight="700" letter-spacing="38" fill="rgba(236, 237, 234, 0.032)">STXIC</text>
    <polygon class="card-sheen" points="0,10 140,10 -20,360 -160,360" fill="url(#sheenGrad)"/>
  </g>

  <rect x="10" y="10" width="1180" height="350" rx="5" fill="none" stroke="#383D47" stroke-width="1"/>
  <rect x="20" y="20" width="1160" height="330" rx="2" fill="none" stroke="#242830" stroke-width="0.65"/>

  <text x="56" y="60" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing="1.5" fill="#ACB0B8">c.lascuna556171@umindanao.edu.ph</text>
  <text x="56" y="79" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#7D828C">DAVAO CITY, PHILIPPINES (UTC+8)</text>

  <g transform="translate(1144, 60)">
    <text x="0" y="0" text-anchor="end" font-family="Georgia, 'Times New Roman', Didot, 'Bodoni MT', serif" font-size="18" letter-spacing="4.2" fill="#ECEDEA">STXIC LABS</text>
    <text x="0" y="19" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1.8" fill="#7D828C">AI SYSTEMS  &#8226;  OPTICAL ARCHIVE</text>
  </g>

  <text x="600" y="176" text-anchor="middle" font-family="Georgia, 'Times New Roman', Didot, 'Bodoni MT', serif" font-size="58" font-weight="400" letter-spacing="2.4" fill="#ECEDEA">Christian Lascu&#241;a</text>
  <text x="600" y="210" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="2.8" fill="#ACB0B8">MENTOR  &#8226;  FULL STACK  &#8226;  TECH GENERALIST  &#8226;  AI SPECIALIST</text>

  <line x1="420" y1="232" x2="780" y2="232" stroke="#242830" stroke-width="0.9"/>

  <text x="600" y="261" text-anchor="middle" font-family="Georgia, 'Times New Roman', Didot, 'Bodoni MT', serif" font-size="18" font-style="italic" fill="#ACB0B8">&#8220;I build living web experiences, engineer the connections between them, and automate the rest.&#8221;</text>

  <line x1="56" y1="304" x2="1144" y2="304" stroke="#242830" stroke-width="0.8"/>

  <g transform="translate(56, 331)">
    <circle class="dot-pulse" cx="4" cy="-3.5" r="2.8" fill="#ECEDEA"/>
    <text x="16" y="0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1.8" fill="#7D828C">QA MENTOR @ UM SKILLS CLINIC</text>
  </g>
  <text x="600" y="331" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="2" fill="#7D828C">UNIVERSITY OF MINDANAO  &#8226;  BSIT</text>
  <text x="1144" y="331" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1.8" fill="#ACB0B8">ENGINEER. AUTOMATOR. ARCHITECT.</text>
</svg>