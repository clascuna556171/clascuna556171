<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Christian Lascuna — STXIC Labs Executive Business Card">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F6F0"/>
      <stop offset="100%" stop-color="#F1EDE3"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.65)" stop-opacity="0"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.65)" stop-opacity="1"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.65)" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cottonGrain" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.6" fill="rgba(25, 24, 23, 0.048)"/>
      <circle cx="8" cy="9" r="0.5" fill="rgba(25, 24, 23, 0.048)"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="24" y="14" width="1152" height="348" rx="4"/>
    </clipPath>
    <style>
      .card-sheen { animation: cardSweep 9s ease-in-out infinite; }
      .dot-pulse { animation: softPulse 3s ease-in-out infinite; }
      @keyframes cardSweep {
        0%, 100% { transform: translateX(-320px); opacity: 0; }
        40% { opacity: 0.7; }
        70% { transform: translateX(1320px); opacity: 0; }
      }
      @keyframes softPulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.3; }
      }
      @media (prefers-reduced-motion: reduce) {
        .card-sheen, .dot-pulse { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Card Drop Shadow (32pt cardstock depth) -->
  <rect x="28" y="20" width="1148" height="346" rx="4" fill="rgba(25, 24, 23, 0.085)"/>

  <g clip-path="url(#cardClip)">
    <rect x="24" y="14" width="1152" height="348" rx="4" fill="url(#cardGrad)"/>
    <rect x="24" y="14" width="1152" height="348" fill="url(#cottonGrain)"/>

    <!-- Centered Blind-Debossed Papermill Watermark -->
    <text x="600" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', Didot, 'Bodoni MT', serif" font-size="210" font-weight="700" letter-spacing="38" fill="rgba(25, 24, 23, 0.036)">STXIC</text>

    <!-- Glancing Specular Paper Sheen -->
    <polygon class="card-sheen" points="0,14 140,14 -20,362 -160,362" fill="url(#sheenGrad)"/>
  </g>

  <!-- Crisp Edge & Subtle Inner Deboss Frame -->
  <rect x="24" y="14" width="1152" height="348" rx="4" fill="none" stroke="#C2BBAE" stroke-width="1"/>
  <rect x="34" y="24" width="1132" height="328" rx="2" fill="none" stroke="#DDD7CA" stroke-width="0.65"/>

  <!-- Top Corners (Exact Bateman Calling Card Layout) -->
  <text x="68" y="64" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="1.6" fill="#46423B">c.lascuna556171@umindanao.edu.ph</text>
  <text x="68" y="83" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#787268">DAVAO CITY, PHILIPPINES (UTC+8)</text>

  <g transform="translate(1132, 64)">
    <text x="0" y="0" text-anchor="end" font-family="Georgia, 'Times New Roman', Didot, 'Bodoni MT', serif" font-size="17" letter-spacing="4.2" fill="#191817">STXIC LABS</text>
    <text x="0" y="19" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" letter-spacing="1.8" fill="#787268">AI SYSTEMS  &#8226;  OPTICAL ARCHIVE</text>
  </g>

  <!-- Center Hero Identity -->
  <text x="600" y="178" text-anchor="middle" font-family="Georgia, 'Times New Roman', Didot, 'Bodoni MT', serif" font-size="56" font-weight="400" letter-spacing="2.4" fill="#191817">Christian Lascu&#241;a</text>
  <text x="600" y="212" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing="2.8" fill="#46423B">MENTOR  &#8226;  FULL STACK  &#8226;  TECH GENERALIST  &#8226;  AI SPECIALIST</text>

  <line x1="420" y1="234" x2="780" y2="234" stroke="#DDD7CA" stroke-width="0.9"/>

  <text x="600" y="262" text-anchor="middle" font-family="Georgia, 'Times New Roman', Didot, 'Bodoni MT', serif" font-size="17.5" font-style="italic" fill="#46423B">&#8220;I build living web experiences, engineer the connections between them, and automate the rest.&#8221;</text>

  <!-- Bottom Edge Ledger -->
  <line x1="68" y1="306" x2="1132" y2="306" stroke="#DDD7CA" stroke-width="0.8"/>

  <g transform="translate(68, 333)">
    <circle class="dot-pulse" cx="4" cy="-3.5" r="2.8" fill="#191817"/>
    <text x="16" y="0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" letter-spacing="1.8" fill="#787268">QA MENTOR @ UM SKILLS CLINIC</text>
  </g>
  <text x="600" y="333" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#787268">UNIVERSITY OF MINDANAO  &#8226;  BSIT</text>
  <text x="1132" y="333" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" letter-spacing="1.8" fill="#46423B">ENGINEER. AUTOMATOR. ARCHITECT.</text>
</svg>