<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="STXIC Labs Optical Glass Monogram">
  <defs>
    <linearGradient id="orbitChrome" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#424752" stop-opacity="0"/>
      <stop offset="22%" stop-color="#8C919B" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="78%" stop-color="#8C919B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#424752" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dropletBody" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="48%" stop-color="#141619" stop-opacity="0.52"/>
      <stop offset="82%" stop-color="#8C919B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ECEDEA" stop-opacity="0.52"/>
    </radialGradient>
    <radialGradient id="causticGlow" cx="62%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lensClip">
      <circle cx="600" cy="100" r="70"/>
    </clipPath>
    <style>
      .ring-cw { transform-origin: 600px 100px; animation: spinCW 42s linear infinite; }
      .ring-ccw { transform-origin: 600px 100px; animation: spinCCW 58s linear infinite; }
      .orbit-tilt { transform-origin: 600px 100px; animation: orbitSway 11s ease-in-out infinite; }
      .bead-run { animation: beadGlide 9s ease-in-out infinite; }
      .mark-breathe { transform-origin: 600px 100px; animation: breathe 6s ease-in-out infinite; }
      @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes orbitSway {
        0%, 100% { transform: rotate(-7deg) scaleY(1); }
        50% { transform: rotate(-4deg) scaleY(1.06); }
      }
      @keyframes beadGlide {
        0%, 100% { transform: translateX(-290px); opacity: 0.15; }
        50% { transform: translateX(290px); opacity: 0.95; }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring-cw, .ring-ccw, .orbit-tilt, .bead-run, .mark-breathe { animation: none !important; }
      }
    </style>
  </defs>

  <path d="M90 130 C280 52 920 52 1110 130" fill="none" stroke="#242830" stroke-width="0.9"/>
  <path d="M130 70 C320 148 880 148 1070 70" fill="none" stroke="url(#orbitChrome)" stroke-width="1.3"/>
  <circle class="bead-run" cx="600" cy="130" r="2.6" fill="#ECEDEA"/>

  <g stroke="#383D47" stroke-width="1">
    <path d="M168 90 V110 M158 100 H178"/>
    <path d="M1032 90 V110 M1022 100 H1042"/>
  </g>
  <circle cx="168" cy="100" r="2" fill="#7D828C"/>
  <circle cx="1032" cy="100" r="2" fill="#7D828C"/>

  <text x="196" y="104" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="2.4" fill="#7D828C">OPTICAL ARCHIVE</text>
  <text x="1004" y="104" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="2.4" fill="#7D828C">STXIC // MMXXVI</text>

  <g class="ring-ccw">
    <circle cx="600" cy="100" r="92" fill="none" stroke="#242830" stroke-width="0.8" stroke-dasharray="2 7"/>
    <circle cx="508" cy="100" r="2" fill="#7D828C"/>
  </g>
  <g class="ring-cw">
    <circle cx="600" cy="100" r="81" fill="none" stroke="#383D47" stroke-width="0.9" stroke-dasharray="22 16 4 16"/>
    <circle cx="600" cy="19" r="2.4" fill="#ECEDEA"/>
    <circle cx="600" cy="181" r="1.8" fill="#7D828C"/>
  </g>

  <circle cx="600" cy="105" r="70" fill="rgba(0, 0, 0, 0.55)"/>
  <circle cx="600" cy="100" r="70" fill="url(#dropletBody)" stroke="#383D47" stroke-width="1.1"/>
  <circle cx="600" cy="100" r="70" fill="url(#causticGlow)"/>

  <g class="orbit-tilt" clip-path="url(#lensClip)">
    <ellipse cx="600" cy="100" rx="90" ry="23" fill="none" stroke="url(#orbitChrome)" stroke-width="2"/>
    <ellipse cx="600" cy="98.5" rx="90" ry="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="0.6"/>
  </g>

  <g class="mark-breathe">
    <g transform="translate(565, 64) scale(0.70)">
      <path d="M84 17H37C24 17 15 26 15 39C15 52 24 61 37 61H64C69 61 72 64 72 69C72 74 69 77 64 77H16V88H64C77 88 86 80 86 68C86 55 77 48 64 48H37C31 48 28 44 28 39C28 34 31 30 37 30H84V17Z" fill="#ECEDEA"/>
    </g>
  </g>

  <path d="M550 58 A58 58 0 0 1 637 43" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
  <path d="M560 151 A58 58 0 0 0 647 137" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.18"/>
</svg>