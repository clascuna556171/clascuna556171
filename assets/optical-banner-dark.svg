<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="STXIC Labs Optical Glass Monogram">
  <defs>
    <linearGradient id="orbitChrome" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#424752" stop-opacity="0"/>
      <stop offset="22%" stop-color="#8C919B" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="78%" stop-color="#8C919B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#424752" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dropletBody" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="48%" stop-color="#141619" stop-opacity="0.52"/>
      <stop offset="82%" stop-color="#8C919B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ECEDEA" stop-opacity="0.52"/>
    </radialGradient>
    <radialGradient id="causticGlow" cx="62%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lensClip">
      <circle cx="600" cy="105" r="72"/>
    </clipPath>
    <style>
      .ring-cw { transform-origin: 600px 105px; animation: spinCW 42s linear infinite; }
      .ring-ccw { transform-origin: 600px 105px; animation: spinCCW 58s linear infinite; }
      .orbit-tilt { transform-origin: 600px 105px; animation: orbitSway 11s ease-in-out infinite; }
      .bead-run { animation: beadGlide 9s ease-in-out infinite; }
      .mark-breathe { transform-origin: 600px 105px; animation: breathe 6s ease-in-out infinite; }
      @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes orbitSway {
        0%, 100% { transform: rotate(-7deg) scaleY(1); }
        50% { transform: rotate(-4deg) scaleY(1.06); }
      }
      @keyframes beadGlide {
        0%, 100% { transform: translateX(-290px); opacity: 0.15; }
        50% { transform: translateX(290px); opacity: 0.95; }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.88; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring-cw, .ring-ccw, .orbit-tilt, .bead-run, .mark-breathe { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Wide precision orbital guides (from stxic-labs archive-hero) -->
  <path d="M90 135 C280 55 920 55 1110 135" fill="none" stroke="#242830" stroke-width="0.9"/>
  <path d="M130 75 C320 155 880 155 1070 75" fill="none" stroke="url(#orbitChrome)" stroke-width="1.3"/>
  <circle class="bead-run" cx="600" cy="135" r="2.6" fill="#ECEDEA"/>

  <!-- Left & Right Registration Crosshairs -->
  <g stroke="#383D47" stroke-width="1">
    <path d="M168 95 V115 M158 105 H178"/>
    <path d="M1032 95 V115 M1022 105 H1042"/>
  </g>
  <circle cx="168" cy="105" r="2" fill="#70747D"/>
  <circle cx="1032" cy="105" r="2" fill="#70747D"/>

  <text x="196" y="108.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" letter-spacing="2.4" fill="#70747D">OPTICAL ARCHIVE</text>
  <text x="1004" y="108.5" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" letter-spacing="2.4" fill="#70747D">STXIC // MMXXVI</text>

  <!-- Rotating Concentric Calibration Rings -->
  <g class="ring-ccw">
    <circle cx="600" cy="105" r="95" fill="none" stroke="#242830" stroke-width="0.8" stroke-dasharray="2 7"/>
    <circle cx="505" cy="105" r="2" fill="#70747D"/>
  </g>
  <g class="ring-cw">
    <circle cx="600" cy="105" r="83" fill="none" stroke="#383D47" stroke-width="0.9" stroke-dasharray="22 16 4 16"/>
    <circle cx="600" cy="22" r="2.4" fill="#ECEDEA"/>
    <circle cx="600" cy="188" r="1.8" fill="#70747D"/>
  </g>

  <!-- Outer Lens Shadow -->
  <circle cx="600" cy="110" r="72" fill="rgba(0, 0, 0, 0.55)"/>

  <!-- Optical Glass Droplet -->
  <circle cx="600" cy="105" r="72" fill="url(#dropletBody)" stroke="#383D47" stroke-width="1.1"/>
  <circle cx="600" cy="105" r="72" fill="url(#causticGlow)"/>

  <!-- Internal Refractive Orbit -->
  <g class="orbit-tilt" clip-path="url(#lensClip)">
    <ellipse cx="600" cy="105" rx="92" ry="24" fill="none" stroke="url(#orbitChrome)" stroke-width="2"/>
    <ellipse cx="600" cy="103.5" rx="92" ry="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="0.6"/>
  </g>

  <!-- Official STXIC Monogram -->
  <g class="mark-breathe">
    <g transform="translate(564, 68) scale(0.72)">
      <path d="M84 17H37C24 17 15 26 15 39C15 52 24 61 37 61H64C69 61 72 64 72 69C72 74 69 77 64 77H16V88H64C77 88 86 80 86 68C86 55 77 48 64 48H37C31 48 28 44 28 39C28 34 31 30 37 30H84V17Z" fill="#ECEDEA"/>
    </g>
  </g>

  <!-- Specular Crescent Rim Highlight -->
  <path d="M548 62 A60 60 0 0 1 638 46" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
  <path d="M558 158 A60 60 0 0 0 648 144" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.18"/>
</svg>