<svg xmlns="http://www.w3.org/2000/svg" width="580" height="260" viewBox="0 0 580 260" role="img" aria-label="PRJ-06 The Shoe Boy — Serialized per-pair inventory &amp; POS for live-stream sneaker drops.">
  <defs>
    <linearGradient id="pocketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141619"/>
      <stop offset="100%" stop-color="#0F1114"/>
    </linearGradient>
    <linearGradient id="glassGlint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.5" fill="rgba(236, 237, 234, 0.032)"/>
      <circle cx="7" cy="7" r="0.45" fill="rgba(236, 237, 234, 0.032)"/>
    </pattern>
    <clipPath id="pocketClip">
      <rect x="6" y="34" width="568" height="218" rx="6"/>
    </clipPath>
    <style>
      .wave-drift { animation: waveSlide 18s ease-in-out infinite; }
      .wave-drift-slow { animation: waveSlide 23s ease-in-out infinite reverse; }
      .sheet-hover { transform-origin: 480px 44px; animation: sheetBreathe 8s ease-in-out infinite; }
      @keyframes waveSlide {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-34px); }
      }
      @keyframes sheetBreathe {
        0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
        50% { transform: translateY(-2.5px) rotate(-0.8deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wave-drift, .wave-drift-slow, .sheet-hover { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Back Folder Tab + Lip -->
  <path d="M14 12 H182 C190 12 195 22 205 22 H562 C569 22 574 27 574 34 V244 H6 V20 C6 15.5 9.5 12 14 12 Z" fill="#1B1E23" stroke="#383D47" stroke-width="0.9"/>
  <text x="24" y="27" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1.6" fill="#7D828C">PRJ-06 // SOFTWARE &amp; APPS</text>

  <!-- Fanned Paper Specimen Sheets -->
  <g class="sheet-hover">
    <rect x="330" y="12" width="218" height="36" rx="3" fill="#181B20" stroke="#383D47" stroke-width="0.8"/>
    <line x1="344" y1="22" x2="430" y2="22" stroke="#383D47" stroke-width="1"/>
  </g>
  <rect x="362" y="19" width="198" height="30" rx="3" fill="#141619" stroke="#242830" stroke-width="0.8"/>

  <!-- Front Card Shadow -->
  <rect x="9" y="38" width="564" height="216" rx="6" fill="rgba(0, 0, 0, 0.55)"/>

  <g clip-path="url(#pocketClip)">
    <rect x="6" y="34" width="568" height="218" rx="6" fill="url(#pocketGrad)"/>
    <rect x="6" y="34" width="568" height="218" fill="url(#grain)"/>

    <g class="wave-drift">
      <path d="M-20 210 C110 170, 220 240, 360 190 C470 150, 540 195, 640 165 L640 265 L-20 265 Z" fill="rgba(236, 237, 234, 0.04)"/>
      <path d="M-20 210 C110 170, 220 240, 360 190 C470 150, 540 195, 640 165" fill="none" stroke="rgba(236, 237, 234, 0.12)" stroke-width="1"/>
    </g>
    <g class="wave-drift-slow">
      <path d="M-20 230 C140 200, 260 170, 400 210 C500 237, 560 200, 640 217" fill="none" stroke="rgba(236, 237, 234, 0.12)" stroke-width="0.8"/>
    </g>

    <rect x="6" y="34" width="568" height="218" fill="url(#glassGlint)"/>
  </g>

  <rect x="6" y="34" width="568" height="218" rx="6" fill="none" stroke="#383D47" stroke-width="1"/>
  <line x1="14" y1="35" x2="566" y2="35" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>

  <text x="32" y="66" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="1.8" fill="#7D828C">PRJ-06  &#8212;  SHIPPED</text>
  <text x="548" y="66" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="1.6" fill="#7D828C">2026</text>

  <line x1="32" y1="80" x2="548" y2="80" stroke="#242830" stroke-width="0.85"/>

  <text x="32" y="122" font-family="Georgia, 'Times New Roman', Didot, 'Bodoni MT', serif" font-size="32" font-weight="400" letter-spacing="0.4" fill="#ECEDEA">The Shoe Boy</text>
  <text x="32" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#ACB0B8">Serialized per-pair inventory &amp; POS for live-stream sneaker drops.</text>
  <text x="32" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#ACB0B8">Atomic conditional claims across 96 tests prevent double-selling.</text>

  <line x1="32" y1="202" x2="548" y2="202" stroke="#242830" stroke-width="0.85"/>
  <text x="32" y="229" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.8" letter-spacing="0.9" fill="#7D828C">LARAVEL 13  •  PHP 8.3  •  POSTGRESQL  •  SQLITE  •  TAILWIND 4</text>
  <text x="548" y="229" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#ECEDEA">OPEN &#8599;</text>
</svg>